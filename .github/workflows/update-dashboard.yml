name: update-dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

# Pages 배포 권한 추가 (pages/id-token) - Actions 방식 배포에 필요
permissions:
  contents: write
  pages: write
  id-token: write

# 동시 실행 방지: 같은 워크플로가 겹쳐 돌면 생성파일 충돌로 실패 -> 한 번에 하나만 실행(뒤 실행은 대기)
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 의존성 설치 (beautifulsoup4 추가 - 팜플 크롤러 파싱에 필요)
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography beautifulsoup4

      - name: Build dashboard
        run: python build_dashboard.py
        env:
          PHARMALL_EMAIL: ${{ secrets.PHARMALL_EMAIL }}
          PHARMALL_PASSWORD: ${{ secrets.PHARMALL_PASSWORD }}
          DAILYPHARM_EMAIL: ${{ secrets.DAILYPHARM_EMAIL }}
          DAILYPHARM_PASSWORD: ${{ secrets.DAILYPHARM_PASSWORD }}
          PHARMPLE_EMAIL: ${{ secrets.PHARMPLE_EMAIL }}
          PHARMPLE_PASSWORD: ${{ secrets.PHARMPLE_PASSWORD }}
          QPHARM_EMAIL: ${{ secrets.QPHARM_EMAIL }}
          QPHARM_PASSWORD: ${{ secrets.QPHARM_PASSWORD }}
          THANKYOUPHARM_ID: ${{ secrets.THANKYOUPHARM_ID }}
          THANKYOUPHARM_PASSWORD: ${{ secrets.THANKYOUPHARM_PASSWORD }}
          SELLPHARM_EMAIL: ${{ secrets.SELLPHARM_EMAIL }}
          SELLPHARM_PASSWORD: ${{ secrets.SELLPHARM_PASSWORD }}

      # 커밋 단계: 반드시 스테이징(add) -> 커밋 -> pull --rebase -> push 순서
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 변경사항이 없으면 커밋/푸시 건너뜀 (빈 커밋 오류 방지)
          if git diff --cached --quiet; then
            echo "변경사항 없음 - 커밋 건너뜀"
          else
            git commit -m "auto: update dashboard"
            # 동시 실행(경합)으로 push가 거부될 수 있어 최대 5회 재시도
            pushed=0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs --autostash origin main && git push origin main && { pushed=1; break; }
              echo "push 충돌 재시도 $i/5"; git rebase --abort 2>/dev/null || true; sleep 7
            done
            if [ "$pushed" != "1" ]; then echo "push 최종 실패"; exit 1; fi
          fi

      # docs 폴더를 Pages 배포용 아티팩트로 포장
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Pages 배포 (Actions 방식 - 레거시 Jekyll 경로 대체)
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
