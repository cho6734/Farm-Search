name: update-dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 의존성 설치 (beautifulsoup4 추가 - 팜플 크롤러 파싱에 필요)
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography beautifulsoup4

      - name: Build dashboard
        run: python build_dashboard.py
        env:
          PHARMALL_EMAIL: ${{ secrets.PHARMALL_EMAIL }}
          PHARMALL_PASSWORD: ${{ secrets.PHARMALL_PASSWORD }}
          DAILYPHARM_EMAIL: ${{ secrets.DAILYPHARM_EMAIL }}
          DAILYPHARM_PASSWORD: ${{ secrets.DAILYPHARM_PASSWORD }}

      # 커밋 단계: 반드시 스테이징(add) → 커밋 → pull --rebase → push 순서
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 변경사항이 없으면 커밋/푸시 건너뜀 (빈 커밋 오류 방지)
          if git diff --cached --quiet; then
            echo "변경사항 없음 - 커밋 건너뜀"
          else
            git commit -m "auto: update dashboard"
            # 원격에 새 커밋이 있어도 안전하게 합치도록 autostash 포함
            git pull --rebase --autostash origin main
            git push origin main
          fi
